name: sora89-action-bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'  # 06:00 WIB (UTC+7)
  push:
    branches: [ main ]

permissions:
  actions: write
  contents: read
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install puppeteer-core
          npm install dotenv

      - name: Run bot
        env:
          SORA89_USER: ${{ secrets.SORA89_USER }}
          SORA89_PASS: ${{ secrets.SORA89_PASS }}
          RUN_MODE: 'demo'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node src/index.js

      - name: Cleanup old runs
        if: always()
        run: |
          gh run list --repo ${{ github.repository }} --limit 10 --json databaseId -q '.[].databaseId' | while read id; do
            gh run delete $id --repo ${{ github.repository }} --yes 2>/dev/null || true
          done
